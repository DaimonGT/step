<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <ul class="menu">
            <li><a href="#">Ссылка 1</a></li>
            <li><a href="#">Ссылка 2</a></li>
        </ul>
    </div>
    <form action="/submit" method="post">
        <label for="user_name">Имя:</label>
        <input type="text" name="user_name" id="">
        <input type="radio" name="gender" id="" value="male" checked>Мужской
        <input type="radio" name="gender" id="" value="female" checked>Женский
        <input type="checkbox" name="hobby" value="gaming" checked>Игры
        <input type="checkbox" name="hobby" value="reading" checked>Чтение
        <input type="checkbox" name="hobby" value="spor" checked>Спорт
        <label for="city">Город</label>
        <select name="city">
            <option value="Moscow">Москва</option>
            <option value="Vitebsk" selected>Витебск</option>
            <option value="Minsk">Минск</option>
        </select>
        <button type="button" onclick="document.getElementById('my_dialog').showModal()" class="btn">Отправить</button>
        <!--<button type="submit">Отправить</button> -->
    </form>
    <dialog id="my_dialog">
        <p>Отправить данные с опросом</p>
        <button type="button" onclick="this.parentElement.close()">Закрыть</button>
    </dialog>
</body>
</html>
