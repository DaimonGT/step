<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Форма</title>
</head>
<body>
<div class="container">
    <form action="/register" method="post">
        <h1 class="form-title">Регистрация</h1>

        <label for="user_name">Имя:</label>
        <input type="text" id="user_name" name="user_name" placeholder="Введите имя" required>

        <label for="user_email">Email:</label>
        <input type="email" id="user_email" name="user_email" placeholder="Введите email" required>

        <label for="user_password">Пароль:</label>
        <input type="password" id="user_password" name="user_password" placeholder="Введите пароль" required>

        <div class="form-row">
            <label for="gender">Пол:</label>
            <div class="input-group" id = "gender">
            <label><input type="radio" name="gender" value="male" checked> Мужской</label>
            <label><input type="radio" name="gender" value="female"> Женский</label>
            </div>
        </div>

        <div class="form-row">
            <label for="interests">Интересы:</label>
            <div class="input-group" id="interests">
                <label><input type="checkbox" name="interests" value="music"> Музыка</label>
                <label><input type="checkbox" name="interests" value="sport"> Спорт</label>
                <label><input type="checkbox" name="interests" value="reading"> Чтение</label>
            </div>
        </div>

        <div class="form-row">
            <label for="country">Страна:</label>
            <div class="select-wrapper">
                <select id="country" name="country_name" required>
                    <option value="Russia" selected>Россия</option>
                    <option value="England">Англия</option>
                    <option value="USA">США</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-submit">Зарегистрироваться</button>
    </form>
</div>
</body>
</html>
