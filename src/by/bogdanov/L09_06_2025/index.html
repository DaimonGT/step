<!DOCTYPE html>
<html>
<style>
    div.container {
    width: 100%;
    overflow: auto;
    }
    div.container div{
    width: 33%;
    float:left;
    }

    div.container div p {
    font-weight: bold;
    }
    table, th, td {
        border: 1px solid black;
        text-align: center;
    }
    table{
        width: 100%;
    }
    th{
        background-color: burlywood;
    }
    #style_red {
        background-color: crimson;
    }
    .font_weight_bold{
        background-color: pink;
        font-weight: bold;
    }
    .color_line{
        border-width: 5px;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<p>Тут не жирный</p>
<em>Здесь курсив</em><br>
<strong>Тут жирный</strong>
<div class="container">
    <div style="background-color:#FF9800">
        <h2>Минск</h2>
        <p><strong>Минск столица Беларуси</strong></p>
        <p>Население 9 млн</p>
    </div>
    <div style="background-color:#FFC0C7">
        <h2>Москва</h2>
        <p>Москва столица России</p>
        <p>Население 143 млн</p>
    </div>
    <div style="background-color:#D9EEE1">
        <h2>Варшава</h2>
        <p>Варшава столица Польшы</p>
        <p>Население 37 млн</p>
    </div>
</div>
<div class="mytable">
    <table>
        <tr>
            <th>Person 1</th>
            <th>Person 2</th>
            <th>Person 3</th>
        </tr>
        <tr>
            <td id="style_red">Dima</td>
            <td>Sasha</td>
            <td>Masha</td>
        </tr>
        <tr>
            <td class="font_weight_bold">33</td>
            <td class="font_weight_bold">29</td>
            <td class="font_weight_bold">37</td>
        </tr>
    </table>
</div>
<p>Текст</p>
<hr class="color_line" color="red">
<p>пример</p>
</body>
</html>
